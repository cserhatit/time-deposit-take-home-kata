spring.application.name=time-deposit-kata

# Defaults match compose.yaml; override with environment variables in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timedeposits}
spring.datasource.username=${DB_USERNAME:timedeposits}
spring.datasource.password=${DB_PASSWORD:timedeposits}

# Schema only. Demo data is added by the dev profile (application-dev.properties).
spring.flyway.locations=classpath:db/migration

# Flyway owns the schema; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
# No database session during JSON rendering: everything a response needs is loaded in the persistence adapter.
spring.jpa.open-in-view=false
# Keep the README's camelCase table and column names exactly (Spring's default strategy would convert them to snake_case).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Send balance updates in batches.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
